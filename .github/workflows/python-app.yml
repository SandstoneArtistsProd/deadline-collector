name: Python Application

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test imports
      run: |
        python -c "import sys; sys.path.insert(0, 'src'); from database import ArticleDatabase"
        python -c "import sys; sys.path.insert(0, 'src'); from content_extractor import ContentExtractor"
        python -c "import sys; sys.path.insert(0, 'src'); from deadline_collector import DeadlineCollector"
        python -c "import sys; sys.path.insert(0, 'src'); from csv_exporter import CSVExporter"

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort

    - name: Check formatting with black
      continue-on-error: true
      run: |
        black --check src/ collector.py

    - name: Check import sorting with isort
      continue-on-error: true
      run: |
        isort --check-only src/ collector.py
