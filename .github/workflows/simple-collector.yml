name: Simple Deadline Collector

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run article collection
      run: |
        python collector.py

    - name: Display statistics
      run: |
        python collector.py --stats

    - name: Export articles to CSV
      run: |
        python collector.py --export

    - name: Export articles to JSON
      run: |
        python collector.py --export-json


    - name: Copy CSV exports to data folder
      run: |
        mkdir -p data
        cp exports/*.csv data/ 2>/dev/null || echo "No CSV files to copy"

    - name: Commit and push updated data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff --staged --quiet || git commit -m "Daily update: deadline articles $(date -u '+%Y-%m-%d')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload CSV as artifact backup
      uses: actions/upload-artifact@v4
      with:
        name: deadline-articles
        path: exports/*.csv
